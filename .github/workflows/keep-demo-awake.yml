name: Keep the live demo awake

# The Cloud Run service keeps one copy running (min-instances 1); this request every 15 minutes is a backup, so a
# judge never waits for a cold start.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

env:
  DEMO_URL: https://cardioclarity-962866578386.us-central1.run.app

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request the demo's health check
        run: >-
          curl --fail --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors --max-time 90
          "$DEMO_URL/health"
